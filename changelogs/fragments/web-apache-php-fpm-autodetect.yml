bugfixes:
  - zabbix_web role - create the PHP-FPM pool on Debian and Ubuntu when the packaged Apache configuration proxies PHP to it. On newer distributions (for example Ubuntu 26.04) the ``zabbix-apache-conf`` package serves PHP via php-fpm (``SetHandler "proxy:unix:/var/run/php/zabbix.sock|fcgi://localhost"``) instead of mod_php, but the role assumed Apache always used mod_php and skipped PHP-FPM, so the socket was never created and the frontend returned HTTP 503. The role now enables PHP-FPM creation when the enabled Apache configuration references the socket it manages, leaving distributions whose packaged configuration uses mod_php untouched.

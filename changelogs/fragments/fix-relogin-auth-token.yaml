bugfixes:
  - httpapi zabbix plugin - fix the re-login handling in ``send_request()``. It read the new auth token from ``self.connection._auth["auth"]``, a key that is never set anywhere in the plugin, always raising a ``KeyError``. On an even older release the same code path instead called ``json.loads()`` on the already-decoded request dict, raising a ``TypeError`` (the JSON object must be str, bytes or bytearray, not dict). Either way, any re-login triggered mid-session (e.g. after a Zabbix-side session invalidation) made every subsequent module call in the task fail with a cryptic connection error instead of transparently re-authenticating. The fix reuses ``self.auth`` (set by ``login()``) and follows the same Bearer-header-vs-``data['auth']`` branch used for the initial request, based on the Zabbix API version (https://github.com/ansible-collections/community.zabbix/issues/1642).

minor_changes:
  - zabbix_authentication - add global MFA configuration by method name for Zabbix 8.0 and later.
  - zabbix_user_directory - add SAML certificate and private key configuration for Zabbix 8.0 and provisioned media settings.
bugfixes:
  - zabbix_authentication - preserve omitted provisioning settings, clear explicit empty settings, match LDAP directory names exactly, and manage SAML case sensitivity on current Zabbix versions.

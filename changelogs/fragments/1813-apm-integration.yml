---
minor_changes:
  - >-
    zabbix_proxy role - support APM collectors, TLS, telemetry providers and API settings on
    Zabbix 8.0+ with Red Hat family 10+, Ubuntu 24.04+ and Debian 12+
    (https://github.com/ansible-collections/community.zabbix/pull/1813).
  - >-
    zabbix_web role - configure frontend telemetry data sources on Zabbix 8.0+
    (https://github.com/ansible-collections/community.zabbix/pull/1813).
  - >-
    zabbix_server role - configure history and telemetry providers and initialize missing
    ClickHouse tables using packaged schemas. Set ``zabbix_server_database_telemetry_sqlload=false``
    to manage schemas separately (https://github.com/ansible-collections/community.zabbix/pull/1813).
  - >-
    zabbix_proxy - manage APM collection, rate limits, resource attributes and telemetry query
    timeouts on Zabbix 8.0+ (https://github.com/ansible-collections/community.zabbix/pull/1813).
  - >-
    zabbix_proxy_info - return APM settings on Zabbix 8.0+
    (https://github.com/ansible-collections/community.zabbix/pull/1813).
bugfixes:
  - >-
    zabbix_web role - forward Authorization headers from Apache to PHP-FPM for authenticated
    API requests (https://github.com/ansible-collections/community.zabbix/pull/1813).
  - >-
    zabbix_proxy - compare existing settings in check mode and preserve explicit zero values
    when updating proxies (https://github.com/ansible-collections/community.zabbix/pull/1813).

---
- name: "Set zabbix_agent_version_long for amd64"
  when:
    - zabbix_agent_version_long is not defined
    - ansible_facts['architecture'] == 'x86_64'
  set_fact:
    zabbix_agent_version_long: "{{
      _zabbix_agent_mac_amd64_releases[zabbix_agent_mac_install_type][zabbix_agent_version | string] }}"

- name: "Get version for arm64"
  when:
    - zabbix_agent_version_long is not defined
    - ansible_facts['architecture'] == 'aarch64'
  block:
    - name: "Get latest zabbix releases"
      uri:
        url: "{{ zabbix_agent_releases_url }}"
        return_content: true
        status_code: [200, 304]
      register: _zabbix_agent_versions
      run_once: true
      check_mode: false

    - name: "Set zabbix_agent_version_long for arm64"
      set_fact:
        zabbix_agent_version_long: "{{ _zabbix_agent_versions.json | json_query(_latest_release) }}"
      vars:
        _latest_release: "versions[?version=='{{ zabbix_agent_version }}'].latest_release.release | [0]"

- name: "Download the Zabbix package"
  ansible.builtin.get_url:
    url: "{{ zabbix_agent_download_url }}"
    dest: "/tmp/{{ zabbix_agent_download_filename }}"
    mode: 0644
  register: _zabbix_agent_mac_download

- name: "Install agent from {{ zabbix_agent_mac_install_type }}"
  include_tasks: "install-Darwin-{{ zabbix_agent_mac_install_type }}.yml"

- name: "Create log dir zabbix-agent"
  ansible.builtin.file:
    path: "{{ zabbix_agent_log_dir }}"
    owner: zabbix
    group: zabbix
    mode: "0755"
    state: directory
  become: true


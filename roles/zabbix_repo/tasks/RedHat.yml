---
# Tasks specific for RedHat systems

- name: "RedHat | Make sure old file is absent"
  ansible.builtin.file:
    path: /etc/yum.repos.d/zabbix-supported.repo
    state: absent
  become: true
  tags:
    - install

- name: "RedHat | Install GPG key"
  ansible.builtin.get_url:
    url: "{{ item }}"
    dest: "/etc/pki/rpm-gpg/{{ item | basename }}"
  environment:
    http_proxy: "{{ zabbix_http_proxy | default('') }}"
    https_proxy: "{{ zabbix_https_proxy | default('') }}"
  become: true
  loop:
    - "{{ zabbix_repo_rpm_gpg_key_url }}"
    - "{{ zabbix_repo_rpm_gpg_key_non_supported_url }}"
  tags:
    - install

- name: "RedHat | Install basic repo file"
  ansible.builtin.yum_repository:
    name: "{{ item.name }}"
    description: "{{ item.description }}"
    baseurl: "{{ item.baseurl }}"
    gpgcheck: "{{ item.gpgcheck | default(omit) }}"
    gpgkey: "{{ item.gpgkey }}"
    mode: "{{ item.mode | default('0644') }}"
    priority: "{{ item.priority | default('99') }}"
    state: "{{ item.state | default('present') }}"
    proxy: "{{ zabbix_http_proxy | default(omit) }}"
    username: "{{ item.username | default(omit) }}"
    password: "{{ item.password | default(omit) }}"
    sslverify: "{{ item.sslverify  | default('true') }}"
  loop: "{{ zabbix_repo_yum }}"
  become: true
  tags:
    - install

- name: "RedHat | Configure EPEL"
  when: zabbix_repo_manage_epel | bool
  become: true
  tags:
    - install
  block:
    - name: "RedHat | Install epel-release"
      ansible.builtin.package:
        name: epel-release
        state: present
      environment:
        http_proxy: "{{ zabbix_http_proxy | default('') }}"
        https_proxy: "{{ zabbix_https_proxy | default('') }}"
      register: _zabbix_repo_epel_installed
      until: _zabbix_repo_epel_installed is succeeded

    - name: "RedHat | Enable EPEL and exclude its Zabbix packages"
      community.general.ini_file:
        path: /etc/yum.repos.d/epel.repo
        section: epel
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        no_extra_spaces: true
        mode: "0644"
      loop:
        - option: enabled
          value: "1"
        - option: excludepkgs
          value: "zabbix*"

---
- name: Install APM dependencies
  ansible.builtin.package:
    name: "{{ zabbix_proxy_apm_dependencies }}"
    state: present
    enablerepo: "{{ (ansible_facts.os_family == 'RedHat') | ternary(zabbix_proxy_apm_enable_repo, omit) }}"
    install_weak_deps: "{{ (ansible_facts.os_family == 'RedHat') | ternary(false, omit) }}"
  environment:
    http_proxy: "{{ zabbix_http_proxy | default('') }}"
    https_proxy: "{{ zabbix_https_proxy | default('') }}"
  when: zabbix_proxy_apm_dependencies | length > 0
  register: _zabbix_proxy_apm_dependencies_installed
  until: _zabbix_proxy_apm_dependencies_installed is succeeded
  become: true
  tags:
    - install
    - dependencies

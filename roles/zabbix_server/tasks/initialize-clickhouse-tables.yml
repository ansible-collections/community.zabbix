---
- name: ClickHouse | Query tables over HTTP
  ansible.builtin.uri:
    url: "{{ _clickhouse_connection.url }}"
    method: POST
    url_username: "{{ _clickhouse_connection.username or omit }}"
    url_password: "{{ _clickhouse_connection.password or omit }}"
    force_basic_auth: true
    return_content: true
    timeout: 60
    use_netrc: false
    validate_certs: >-
      {{ _clickhouse_connection.ssl_verify_peer | bool or _clickhouse_connection.ssl_verify_host | bool }}
    ca_path: "{{ _clickhouse_connection.ssl_ca_location or omit }}"
    client_cert: >-
      {{ [_clickhouse_connection.ssl_cert_location or '', _clickhouse_connection.ssl_cert_file] | path_join
         if _clickhouse_connection.ssl_cert_file else omit }}
    client_key: >-
      {{ [_clickhouse_connection.ssl_key_location or '', _clickhouse_connection.ssl_key_file] | path_join
         if _clickhouse_connection.ssl_key_file else omit }}
    body: "{{ _clickhouse_table_query }}"
  register: _zabbix_server_clickhouse_tables_http
  changed_when: false
  check_mode: false
  when: not _clickhouse_curl_required

# uri cannot bind a source IP, decrypt a client key, or load a CA directory.
- name: ClickHouse | Query tables with advanced connection options
  ansible.builtin.command:
    argv:
      - curl
      - --disable
      - --config
      - "{{ _zabbix_server_clickhouse_temp.path }}/.curlrc"
      - "{{ _clickhouse_connection.url }}"
      - --data-binary
      - "{{ _clickhouse_table_query }}"
  register: _zabbix_server_clickhouse_tables_curl
  changed_when: false
  check_mode: false
  when: _clickhouse_curl_required

- name: ClickHouse | Read table names
  ansible.builtin.set_fact:
    _clickhouse_existing_tables: >-
      {{ _zabbix_server_clickhouse_tables_curl.stdout_lines if _clickhouse_curl_required
         else _zabbix_server_clickhouse_tables_http.content.splitlines() }}

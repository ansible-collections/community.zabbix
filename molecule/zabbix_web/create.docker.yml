---
- name: Create
  hosts: localhost
  connection: local

  gather_facts: false

  vars:
    _version_groups: ["v60", "v70", "v74", "v80"]
    _g_to_v:
      v60: "6.0"
      v70: "7.0"
      v74: "7.4"
      v80: "8.0"
    _pgsql_13_versions: ['v60', 'v70', 'v74']

  pre_tasks:
    - name: Create network
      community.docker.docker_network:
        name: zabbix

    - name: Create dependency/integration containers
      vars:
        _database_groups: ['mysql', 'pgsql']
        _db_type: "{{ item.groups | intersect(_database_groups) | first }}"
        _clickhouse_platforms: "{{ molecule_yml.platforms | selectattr('groups', 'contains', 'v80') }}"
      block:
        - name: Create ClickHouse container(s)
          community.docker.docker_container:
            name: "{{ item.name }}-clickhouse"
            # APM requires ClickHouse 26.8.17.4 or later.
            image: clickhouse/clickhouse-server:26.9.21.9
            # The server entrypoint creates the telemetry schema, so ClickHouse must answer first.
            state: healthy
            recreate: true
            networks:
              - name: zabbix
            env:
              CLICKHOUSE_DB: zabbixapm
              CLICKHOUSE_USER: zabbix
              CLICKHOUSE_PASSWORD: zabbix
            ulimits:
              - nofile:262144:262144
            healthcheck:
              # Not localhost: the entrypoint's init server listens there first.
              test: ["CMD-SHELL", "clickhouse-client --host \"$(hostname -i)\" --user zabbix --password zabbix --query 'SELECT 1'"]
              interval: 2s
              retries: 30
          loop: "{{ _clickhouse_platforms }}"
          loop_control:
            label: "{{ item.name }}-clickhouse"

        - name: Create Zabbix server database container(s)
          community.docker.docker_container:
            name: "{{ item.name }}-db"
            image: "{{ _container[_db_type].image }}"
            state: started
            recreate: true
            networks:
              - name: zabbix
            env: "{{ _container[_db_type].env }}"
          loop: "{{ molecule_yml.platforms }}"
          loop_control:
            label: "{{ item.name }}-db"
          when: (item.groups | intersect(_database_groups) | length) > 0
          vars:
            _pgsql_tag: "{{ (item.groups | intersect(_pgsql_13_versions) | length > 0) | ternary('latest-pg13', 'latest-pg15') }}"
            _container:
              mysql:
                image: "mysql:8.4.8"
                env: { MYSQL_ROOT_PASSWORD: changeme }
              pgsql:
                image: "timescale/timescaledb:{{ _pgsql_tag }}"
                env:
                  POSTGRES_USER: zabbix
                  POSTGRES_PASSWORD: zabbix

        - name: Create Zabbix server container(s)
          community.docker.docker_container:
            name: "{{ item.name }}-server"
            image: "zabbix/zabbix-server-{{ _db_type }}:alpine-{{ _g_to_v[_version] }}-latest"
            state: started
            recreate: true
            networks:
              - name: zabbix
            env: "{{ _container[_db_type].env | combine((item in _clickhouse_platforms) | ternary(_telemetry_env, {})) }}"
          loop: "{{ molecule_yml.platforms }}"
          loop_control:
            label: "{{ item.name }}-server"
          vars:
            _version: "{{ item.groups | intersect(_version_groups) | first }}"
            # The server entrypoint creates the telemetry schema in ClickHouse.
            _telemetry_env:
              ZBX_TELEMETRYPROVIDER_0: '{"provider":"clickhouse","url":"http://{{ item.name }}-clickhouse:8123","db":"zabbixapm"}'
              ZBX_TELEMETRYPROVIDER_0_USERNAME: zabbix
              ZBX_TELEMETRYPROVIDER_0_PASSWORD: zabbix
              ZBX_TELEMETRYPROVIDER_0_SCHEMA: '{"create":true}'
            _container:
              mysql:
                env:
                  MYSQL_ROOT_PASSWORD: changeme
                  MYSQL_USER: zabbix
                  MYSQL_PASSWORD: zabbix
                  DB_SERVER_HOST: "{{ item.name }}-db"
              pgsql:
                env:
                  POSTGRES_USER: zabbix
                  POSTGRES_PASSWORD: zabbix
                  DB_SERVER_HOST: "{{ item.name }}-db"

        - name: Seed a fake trace once the server has created the telemetry schema
          community.docker.docker_container_exec:
            container: "{{ item.name }}-clickhouse"
            argv:
              - clickhouse-client
              - "--host={{ item.name }}-clickhouse"
              - --user=zabbix
              - --password=zabbix
              - >-
                --query=INSERT INTO zabbixapm.otel_traces
                (Timestamp, TraceId, SpanId, SpanName, SpanKind, ServiceName, Duration, StatusCode)
                VALUES (now64(9), '0123456789abcdef0123456789abcdef', '0123456789abcdef',
                'Molecule APM test', 'Server', 'molecule-apm', 1000000, 'Ok')
          register: _seed
          # otel_traces appears once the server entrypoint has run.
          until: _seed.rc == 0
          retries: 30
          delay: 2
          loop: "{{ _clickhouse_platforms }}"
          loop_control:
            label: "{{ item.name }}-clickhouse"

  tasks:
    - name: Create OS container(s)
      community.docker.docker_container:
        state: started
        recreate: true
        name: "{{ item.name }}"
        image: "{{ item.image }}"
        privileged: "{{ item.privileged | default(omit) }}"
        networks:
          - name: zabbix
        volumes: "{{ item.volumes | default(omit) }}"
        cgroupns_mode: "{{ item.cgroupns_mode | default(omit) }}"
        published_ports:
          - "{{ 8000 + ansible_loop.index0 }}:80"
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"
        extended: true

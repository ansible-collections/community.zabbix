---
- name: Verify zabbix_web
  hosts: all
  gather_facts: true

  tasks:
    - name: Gather package facts
      package_facts:

    - name: Assert zabbix-web packages are installed with correct version
      assert:
        that:
          - _web_pkg_name in ansible_facts.packages
          - zabbix_web_version in (ansible_facts.packages[_web_pkg_name] | first).version
          - _conf_pkg_name in ansible_facts.packages
          - zabbix_web_version in (ansible_facts.packages[_conf_pkg_name] | first).version
      vars:
        # Starting with version 7.0, Suse appears to append -php8 to the package names zabbix-apache-conf and zabbix-nginx-conf.
        _php_suffix: "{{ (ansible_facts.os_family == 'Suse' and zabbix_web_version is version('7.0', '>=')) | ternary('-php8', '') }}"
        _web_pkg_map:
          Debian: "zabbix-frontend-php"
        _web_pkg_name: "{{ _web_pkg_map[ansible_facts.os_family] | default('zabbix-web-' ~ zabbix_server_database) }}"
        _conf_pkg_name: "zabbix-{{ zabbix_web_http_server }}-conf{{ _php_suffix }}"

    - name: Stat zabbix.conf.php
      stat:
        path: /etc/zabbix/web/zabbix.conf.php
      register: _zabbix_conf_php

    - name: Assert zabbix.conf.php exists with correct ownership and mode
      assert:
        that:
          - _zabbix_conf_php.stat.exists
          - _zabbix_conf_php.stat.pw_name == _owner[ansible_facts.os_family]
          - _zabbix_conf_php.stat.gr_name == _group[ansible_facts.os_family]
          - _zabbix_conf_php.stat.mode == '0600'
      vars:
        _owner:
          Debian: www-data
          RedHat: apache
          Suse: wwwrun
        _group:
          Debian: www-data
          RedHat: apache
          Suse: www

    - name: Test Zabbix API login
      uri:
        url: "http://{{ zabbix_api_server_url }}/api_jsonrpc.php"
        method: POST
        headers:
          Content-Type: application/json-rpc
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "user.login"
          params:
            username: Admin
            password: zabbix
          id: auth
        return_content: true
      register: _zabbix_api_response

    - name: Assert Zabbix API login succeeded
      assert:
        that:
          - _zabbix_api_response.json.result is defined
          - _zabbix_api_response.json.result | length > 0

    - name: Verify APM frontend connection
      when: zabbix_web_version is version('8.0', '>=')
      vars:
        ansible_connection: httpapi
        ansible_network_os: community.zabbix.zabbix
        ansible_host: 127.0.0.1
        ansible_httpapi_port: "{{ 8000 + (molecule_yml.platforms | map(attribute='name') | list).index(inventory_hostname) }}"
        ansible_httpapi_use_ssl: false
        ansible_zabbix_url_path: ''
        ansible_zabbix_http_headers:
          Host: "{{ zabbix_api_server_url }}"
        ansible_user: Admin
        ansible_httpapi_pass: zabbix
      block:
        - name: Query records and counts for all four signals through the module
          community.zabbix.zabbix_apm_info:
            signal: "{{ item.0 }}"
            time_from: 0
            time_till: "{{ ansible_facts.date_time.epoch | int + 3600 }}"
            output: [service_name]
            count_output: "{{ item.1 }}"
            limit: 1
          loop: "{{ ['traces', 'spans', 'metrics', 'logs'] | product([false, true]) | list }}"
          delegate_to: localhost
          register: _apm_queries

        - name: Assert the frontend returned the seeded trace and normalized results
          assert:
            that:
              - item.changed is sameas false
              - item.zabbix_apm.signal == item.item.0
              - item.zabbix_apm.records | type_debug == 'list'
              - item.zabbix_apm.count | type_debug == 'int'
              - item.zabbix_apm.count == ((item.item.0 in ['traces', 'spans']) | ternary(1, 0))
              - item.zabbix_apm.records | length == (item.item.1 | ternary(0, item.zabbix_apm.count))
              - item.item.1 or item.item.0 not in ['traces', 'spans'] or item.zabbix_apm.records[0].service_name == 'molecule-apm'
          loop: "{{ _apm_queries.results }}"
          loop_control:
            label: "{{ item.item }}"

---
dependency:
  name: galaxy
  enabled: true
  options:
    requirements-file: molecule/default/collections.yml

driver:
  name: default

platforms:
  - name: zabbix-proxy-${MY_MOLECULE_DATABASE:-mysql}-${MY_MOLECULE_VERSION:-v80}-${MY_MOLECULE_IMAGE:-rockylinux10}
    image: geerlingguy/docker-${MY_MOLECULE_IMAGE:-rockylinux10}-ansible:latest
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - ${MY_MOLECULE_DATABASE:-mysql}
      - ${MY_MOLECULE_VERSION:-v80}
  # psk-active
  - name: zabbix-proxy-${MY_MOLECULE_DATABASE:-mysql}-${MY_MOLECULE_VERSION:-v80}-psk-active-${MY_MOLECULE_IMAGE:-rockylinux10}
    image: geerlingguy/docker-${MY_MOLECULE_IMAGE:-rockylinux10}-ansible:latest
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - ${MY_MOLECULE_DATABASE:-mysql}
      - ${MY_MOLECULE_VERSION:-v80}
      - psk
      - active
  # psk-passive
  - name: zabbix-proxy-${MY_MOLECULE_DATABASE:-mysql}-${MY_MOLECULE_VERSION:-v80}-psk-passive-${MY_MOLECULE_IMAGE:-rockylinux10}
    image: geerlingguy/docker-${MY_MOLECULE_IMAGE:-rockylinux10}-ansible:latest
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - ${MY_MOLECULE_DATABASE:-mysql}
      - ${MY_MOLECULE_VERSION:-v80}
      - psk
      - passive


provisioner:
  name: ansible
  playbooks:
    create: ../default/create.with_stack.docker.yml
    destroy: ../default/destroy.with_stack.docker.yml
  env:
    # https://github.com/ansible/molecule/issues/4015#issuecomment-1680859724
    ANSIBLE_ROLES_PATH: ../../roles
    ANSIBLE_INJECT_FACT_VARS: "False"
  inventory:
    group_vars:
      all:
        ansible_connection: community.docker.docker
        zabbix_repo_manage_epel: true
        zabbix_proxy_hostname: "{{ inventory_hostname }}"
        zabbix_proxy_configfrequency: 10
        zabbix_api_create_proxy: true
        ansible_zabbix_url_path: ""
      psk:
        zabbix_proxy_tlspskfile: "/home/zabbix/proxy_psk"
        zabbix_proxy_tlspskidentity: "PSK {{ inventory_hostname }}"
        zabbix_proxy_tlspsk_secret: 'f1447b20c0243f3304062d3641fe7e341eb0106bd1adb4273f21659a7717ae6f'
      active:
        zabbix_proxy_proxymode: 0
        zabbix_proxy_status: active
        zabbix_proxy_tlsconnect: psk
      passive:
        zabbix_proxy_proxymode: 1
        zabbix_proxy_status: passive
        zabbix_proxy_tlsaccept: psk
      v80:
        zabbix_proxy_version: "8.0"
        # APM packages are available only on these platforms, even with Zabbix 8.0+.
        zabbix_proxy_apm_enabled: >-
          {{ zabbix_proxy_version is version('8.0', '>=') and (
               (ansible_facts.os_family == 'RedHat' and ansible_facts.distribution_major_version | int >= 10) or
               (ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_version is version('24.04', '>=')) or
               (ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version | int >= 12)
             ) }}
        zabbix_proxy_apm: "{{ zabbix_proxy_apm_enabled | bool | ternary(_zabbix_proxy_test_apm, {}) }}"
        _zabbix_proxy_test_apm:
          data_collection_status: 1
          max_messages_per_second: 1000
          additional_resource_attributes:
            - key: test.environment
              value: molecule
              signal_type: 0
            - key: test.environment
              value: molecule
              signal_type: 1
            - key: test.environment
              value: molecule
              signal_type: 2
        zabbix_proxy_telemetryprovider: "{{ zabbix_proxy_apm_enabled | bool | ternary(_zabbix_proxy_test_telemetryprovider, {}) }}"
        _zabbix_proxy_test_telemetryprovider:
          provider: clickhouse
          url: "http://{{ zabbix_proxy_server }}-clickhouse:8123"
          db: zabbixapm
          username: zabbix
          password: zabbix
          ssl_verify_peer: false
          ssl_verify_host: false
        zabbix_proxy_server: zabbix-server-v80
        zabbix_api_server_host: zabbix-web-v80
        zabbix_api_server_port: 8080
      v74:
        zabbix_proxy_version: "7.4"
        zabbix_proxy_server: zabbix-server-v74
        zabbix_api_server_host: zabbix-web-v74
        zabbix_api_server_port: 8074
      v70:
        zabbix_proxy_version: "7.0"
        zabbix_proxy_server: zabbix-server-v70
        zabbix_api_server_host: zabbix-web-v70
        zabbix_api_server_port: 8070
      v60:
        zabbix_proxy_version: "6.0"
        zabbix_proxy_server: zabbix-server-v60
        zabbix_api_server_host: zabbix-web-v60
        zabbix_api_server_port: 8060
      mysql:
        zabbix_proxy_database: mysql
        zabbix_proxy_dbhost: "{{ inventory_hostname }}-db"
        zabbix_proxy_dbhost_run_install: false
        zabbix_proxy_privileged_host: "%"
        zabbix_proxy_mysql_login_host: "{{ inventory_hostname }}-db"
        zabbix_proxy_mysql_login_user: root
        zabbix_proxy_mysql_login_password: changeme
      pgsql:
        zabbix_proxy_database: pgsql
        zabbix_proxy_dbhost: "{{ inventory_hostname }}-db"
        zabbix_proxy_dbhost_run_install: false
        zabbix_proxy_pgsql_login_host: "{{ inventory_hostname }}-db"
        zabbix_proxy_pgsql_login_user: postgres
        zabbix_proxy_pgsql_login_password: changeme
        # PostgreSQL 14+ images only accept SCRAM, and 8.0 needs PostgreSQL 15+
        zabbix_proxy_dbpassword_hash_method: scram-sha-256
      sqlite3:
        zabbix_proxy_database: sqlite3
        zabbix_proxy_database_long: sqlite3
        zabbix_proxy_dbname: /path/to/sqlite3.db

verifier:
  name: ansible

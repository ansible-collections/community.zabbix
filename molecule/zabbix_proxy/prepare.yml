---
- name: Prepare
  hosts: all

  tasks:
    # To prevent services from starting during package installations on a docker build,
    # images normally come with this set to exit 101.
    - name: Allow services to start on install
      copy:
        content: |
          exit 0
        dest: /usr/sbin/policy-rc.d
      when: ansible_facts['os_family'] == 'Debian'

    - name: Installing packages
      package:
        name: "{{ _packages | select | list }}"
        update_cache: "{{ (ansible_facts['os_family'] in ['Debian', 'Suse']) | ternary(true, omit) }}"
      vars:
        _py3_rpm: "python3{% if ansible_facts.python.version.minor != 6 %}{{ ansible_facts.python.version.minor }}{% endif %}-rpm"
        _packages:
          - sudo
          - "{{ (ansible_facts['os_family'] == 'Suse') | ternary(_py3_rpm, '') }}"
      register: _installation_dependencies
      until: _installation_dependencies is succeeded

    - name: Configure SUDO
      lineinfile:
        dest: /etc/sudoers
        line: "Defaults    !requiretty"
        state: present

    - name: Workaround for mysql on Debian-13
      when:
        - ansible_facts.distribution == "Debian"
        - ansible_facts.distribution_major_version == "13"
        - "'mysql' in group_names"
      copy:
        dest: /root/.my.cnf
        content: |
          [client]
          skip-ssl = true
        mode: '0600'

    - name: Enable CRB for Red Hat APM dependencies
      community.general.ini_file:
        path: /etc/yum.repos.d/rocky.repo
        section: crb
        option: enabled
        value: '1'
        no_extra_spaces: true
        mode: '0644'
      when:
        - ansible_facts.distribution == 'Rocky'
        - zabbix_proxy_version is version('8.0', '>=')
        - zabbix_proxy_apm_enabled | bool

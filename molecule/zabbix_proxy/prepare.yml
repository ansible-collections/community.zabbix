---
- name: Prepare
  hosts: all

  tasks:
    # To prevent services from starting during package installations on a docker build,
    # images normally come with this set to exit 101.
    - name: "Allow services to start on install"
      ansible.builtin.copy:
        content: |
          exit 0
        dest: /usr/sbin/policy-rc.d
      when: ansible_facts['os_family'] == 'Debian'

    # On EL aarch64, Zabbix signs its "non-supported" repo packages (e.g. fping, pulled in by
    # zabbix-proxy) with a key that the zabbix_repo role does not install (the amd64 packages use
    # a different key), so the dnf module fails GPG validation with "Public key ... is not
    # installed". Pre-import that Zabbix key. Idempotent; RedHat only; unused where not needed.
    - name: "Import Zabbix non-supported repo GPG key (EL aarch64 fping)"
      ansible.builtin.rpm_key:
        state: present
        key: https://repo.zabbix.com/RPM-GPG-KEY-ZABBIX-08EFA7DD
      when: ansible_facts['os_family'] == 'RedHat'

    - name: "Installing packages"
      ansible.builtin.package:
        name: "{{ _packages | select | list }}"
        update_cache: "{{ (ansible_facts['os_family'] in ['Debian', 'Suse']) | ternary(true, omit) }}"
      vars:
        _py3_rpm: "python3{% if ansible_facts.python.version.minor != 6 %}{{ ansible_facts.python.version.minor }}{% endif %}-rpm"
        _packages:
          - sudo
          - "{{ (ansible_facts['os_family'] == 'Suse') | ternary(_py3_rpm, '') }}"
      register: installation_dependencies
      until: installation_dependencies is succeeded

    - name: "Configure SUDO."
      ansible.builtin.lineinfile:
        dest: /etc/sudoers
        line: "Defaults    !requiretty"
        state: present

    - name: "Workaround for mysql on Debian-13"
      when:
        - ansible_facts.distribution == "Debian"
        - ansible_facts.distribution_major_version == "13"
        - "'mysql' in group_names"
      copy:
        dest: /root/.my.cnf
        content: |
          [client]
          skip-ssl = true
        mode: '0600'

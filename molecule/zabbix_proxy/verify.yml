---
- name: Verify zabbix_proxy
  hosts: all
  gather_facts: true

  tasks:
    - name: Gather package facts
      package_facts:

    - name: Assert zabbix-proxy package is installed with correct version
      assert:
        that:
          - _proxy_package in ansible_facts.packages
          - zabbix_proxy_version in (ansible_facts.packages[_proxy_package] | first).version
      vars:
        _proxy_package: "zabbix-proxy-{{ zabbix_proxy_database }}{{ (zabbix_proxy_apm_enabled | bool and ansible_facts.os_family == 'RedHat') | ternary('-apm', '') }}"

    - name: Verify the selected Red Hat proxy executable
      ansible.builtin.stat:
        path: /usr/sbin/zabbix_proxy
      register: _proxy_executable
      failed_when: (_proxy_executable.stat.lnk_source | default('')) != _expected_proxy_executable
      vars:
        _expected_proxy_executable: "/usr/sbin/zabbix_proxy_{{ zabbix_proxy_database }}{{ zabbix_proxy_apm_enabled | bool | ternary('_apm', '') }}"
      when:
        - ansible_facts.os_family == 'RedHat'
        - ansible_facts.distribution_major_version | int >= 10
        - zabbix_proxy_version is version('8.0', '>=')

    - name: Gather service facts
      service_facts:

    - name: Assert zabbix-proxy service is enabled and running
      assert:
        that:
          - ansible_facts.services['zabbix-proxy.service'].status == 'enabled'
          - ansible_facts.services['zabbix-proxy.service'].state == 'running'

    - name: Stat zabbix_proxy.conf
      stat:
        path: /etc/zabbix/zabbix_proxy.conf
      register: _proxy_conf

    - name: Assert zabbix_proxy.conf exists with correct ownership and mode
      assert:
        that:
          - _proxy_conf.stat.exists
          - _proxy_conf.stat.pw_name == 'zabbix'
          - _proxy_conf.stat.gr_name == 'zabbix'
          - _proxy_conf.stat.mode == '0640'

    - name: Read zabbix_proxy.conf
      slurp:
        src: /etc/zabbix/zabbix_proxy.conf
      register: _proxy_conf

    # Whole-line matches, so commented-out lines (# Key=value) and longer
    # values don't pass
    - name: Assert zabbix_proxy.conf contains expected settings
      assert:
        that:
          - "'ListenPort=10051' in _proxy_conf_lines"
          - "'DebugLevel=3' in _proxy_conf_lines"
        quiet: true
      vars:
        _proxy_conf_lines: "{{ (_proxy_conf.content | b64decode).splitlines() }}"

    - name: Stat zabbix_proxy.d include directory
      stat:
        path: /etc/zabbix/zabbix_proxy.d
      register: _proxy_include_dir

    - name: Verify APM proxy settings on Zabbix 8.0 or newer
      when:
        - zabbix_proxy_version is version('8.0', '>=')
        - zabbix_proxy_apm_enabled | bool
      block:
        - name: Assert APM collector and telemetry provider configuration
          assert:
            that:
              - "'StartAPMCollector=1' in _proxy_conf_lines"
              - "'APMListenIP=0.0.0.0' in _proxy_conf_lines"
              - "'APMListenPort=4317' in _proxy_conf_lines"
              - >-
                'TelemetryProvider=clickhouse;db="zabbixapm",password="zabbix",ssl_verify_host=0,ssl_verify_peer=0,url="http://' ~ inventory_hostname ~ '-clickhouse:8123",username="zabbix"' in _proxy_conf_lines
            quiet: true
          vars:
            _proxy_conf_lines: "{{ (_proxy_conf.content | b64decode).splitlines() }}"

        - name: Retrieve APM proxy API configuration
          community.zabbix.zabbix_proxy_info:
            proxy_name: "{{ zabbix_proxy_hostname }}"
          register: _proxy_apm_info
          delegate_to: "{{ zabbix_api_server_host }}"
          vars:
            ansible_network_os: community.zabbix.zabbix
            ansible_connection: httpapi
            ansible_host: localhost
            ansible_httpapi_port: "{{ hostvars[inventory_hostname].zabbix_api_server_port }}"
            ansible_zabbix_url_path: ''
            ansible_user: Admin
            ansible_httpapi_pass: zabbix

        - name: Assert APM API enablement, rate limit, and signal attributes
          assert:
            that:
              - _proxy_apm_info.zabbix_proxy.apm.data_collection_status | int == 1
              - _proxy_apm_info.zabbix_proxy.apm.max_messages_per_second | int == 1000
              - _proxy_apm_info.zabbix_proxy.apm.additional_resource_attributes | length == 3
              - _proxy_apm_info.zabbix_proxy.apm.additional_resource_attributes | map(attribute='signal_type') | map('int') | sort == [0, 1, 2]

    - name: Assert include directory exists with correct ownership
      assert:
        that:
          - _proxy_include_dir.stat.exists
          - _proxy_include_dir.stat.isdir
          - _proxy_include_dir.stat.pw_name == 'zabbix'
          - _proxy_include_dir.stat.gr_name == 'zabbix'

    - name: Check zabbix_proxy.log
      block:
        - name: Read zabbix_proxy log file
          slurp:
            src: /var/log/zabbix/zabbix_proxy.log
          register: _proxy_log
          until: >
            (_proxy_log.content | b64decode) is not search('Access denied for user') and
            (_proxy_log.content | b64decode) is not search('database is down: reconnecting') and
            (_proxy_log.content | b64decode) is not search('Both are missing in the system.') and
            (_proxy_log.content | b64decode) is search('current database version') and
            (_proxy_log.content | b64decode) is search('proxy #0 started \[main process\]') and
            (_proxy_log.content | b64decode) is search('received configuration data from server')
          retries: 12
          delay: 10
      always:
        - debug:
            msg: "{{ _proxy_log.content | b64decode | split('\n') }}"

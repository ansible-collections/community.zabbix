---
- name: Converge
  hosts: all

  vars:
    _version_groups: ["v60", "v70", "v74", "v80"]

  pre_tasks:
    # The api is hosted in a container on the localhost, exposed to a known port,
    # that we delegate_to.
    # ansible_port is required to give each host a unique persistent connection;
    # without it, all localhost targets share one connection regardless of
    # zabbix_api_server_port.
    - name: Add zabbix web API host(s) to inventory
      add_host:
        name: "zabbix-web-{{ _version }}"
        ansible_host: localhost
        ansible_port: "{{ 8000 + (_version | regex_replace('v', '') | int) }}"
        zabbix_api_server_port: "{{ 8000 + (_version | regex_replace('v', '') | int) }}"
      loop: "{{ groups.keys() | list | intersect(_version_groups) }}"
      loop_control:
        loop_var: _version
      changed_when: false # don't fail idempotency tests because of this.

  roles:
    - role: zabbix_proxy

  post_tasks:
    - name: Initialize the test data source with the server role
      include_role:
        name: community.zabbix.zabbix_server
        tasks_from: initialize-clickhouse.yml
      vars:
        zabbix_server_version: "{{ zabbix_proxy_version }}"
        zabbix_server_telemetryprovider: "{{ zabbix_proxy_telemetryprovider }}"
      when:
        - zabbix_proxy_version is version('8.0', '>=')
        - zabbix_proxy_apm_enabled | bool

    - name: Seed telemetry after the role initializes the empty ClickHouse database
      include_tasks: ../default/seed.clickhouse.yml
      when:
        - zabbix_proxy_version is version('8.0', '>=')
        - zabbix_proxy_apm_enabled | bool

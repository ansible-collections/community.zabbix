---
- name: Destroy
  hosts: localhost
  connection: local

  gather_facts: false

  tasks:
    - name: Destroy OS container(s)
      community.docker.docker_container:
        name: "{{ item.name }}"
        state: absent
        force_kill: "{{ item.force_kill | default(True) }}"
      loop: "{{ molecule_yml.platforms }}"

    - name: Destroy ClickHouse database container(s)
      community.docker.docker_container:
        name: "{{ item.name }}-clickhouse"
        state: absent
        force_kill: true
        keep_volumes: false
      loop: "{{ molecule_yml.platforms }}"

    - name: Destroy database container(s)
      community.docker.docker_container:
        name: "{{ item.name }}-db"
        state: absent
        force_kill: true
      loop: "{{ molecule_yml.platforms }}"

  post_tasks:
    - name: Destroy network
      community.docker.docker_network:
        name: zabbix
        state: absent

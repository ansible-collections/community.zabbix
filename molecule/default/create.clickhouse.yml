---
# Test-only telemetry storage. No published ports or persistent data are needed.
- name: Create ClickHouse container
  community.docker.docker_container:
    name: "{{ item.name }}-clickhouse"
    # APM requires ClickHouse 26.8.17.4 or later.
    image: clickhouse/clickhouse-server:26.9.21.9
    state: started
    recreate: true
    networks:
      - name: zabbix
    env:
      CLICKHOUSE_DB: zabbixapm
      CLICKHOUSE_USER: zabbix
      CLICKHOUSE_PASSWORD: zabbix
    ulimits:
      - nofile:262144:262144

- name: Wait for ClickHouse
  # The initialization server listens only on localhost and is restarted afterward.
  community.docker.docker_container_exec:
    container: "{{ item.name }}-clickhouse"
    command: "clickhouse-client --host {{ item.name }}-clickhouse --user zabbix --password zabbix --query 'SELECT 1'"
  register: _clickhouse_ready
  until: _clickhouse_ready.rc == 0
  retries: 30
  delay: 2
  changed_when: false

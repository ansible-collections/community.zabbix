---
- name: Create
  hosts: localhost
  connection: local

  gather_facts: false

  vars:
    _version_groups: ["v60", "v70", "v74", "v80"]
    _g_to_v:
      v60: "6.0"
      v70: "7.0"
      v74: "7.4"
      v80: "8.0"
    _pgsql_13_versions: ['v60', 'v70', 'v74']
    # Test CA and certs, shared with the scenario's prepare.yml
    _pki_dir: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/pki"

  pre_tasks:
    - name: Create network
      community.docker.docker_network:
        name: zabbix

    - name: Create PKI directory
      file:
        path: "{{ _pki_dir }}"
        state: directory
        mode: "0755"

    # XXX we'd use community.crypto, but it feels like waste replacing this one
    # command with three lengthy tasks
    - name: Create test root CA
      command: >-
        openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes
          -subj '/O=ansible_collections/OU=community.zabbix/CN=Molecule Root CA' -days 7300
          -x509 -extensions v3_ca
            -addext 'keyUsage = critical, cRLSign, keyCertSign'
          -keyout ca.key
          -out ca.crt
      args:
        chdir: "{{ _pki_dir }}"
        creates: ca.crt

    # We create 1 zabbix db/server/web instance per zabbix version we're testing.
    # For github workflows this is a 1-1 mapping, but developers can add multiple
    # entries to molecule_yml.platforms to test multiple configurations at once, and
    # we don't need 3x the containers for every configuration when testing integration with the server.
    - name: Create dependency/integration containers
      vars:
        # molecule_yml.platforms    => [ { ..., "groups": [ "mysql", "v74" ], ... }, { ... } ]
        # map(attribute='groups')   => [ [ "mysql", "v74" ], [ "pgsql", "v70" ], ... ]
        # flatten                   => [ "mysql", "v74", "pgsql", "v70", "sqlite3", "v60", ... ]
        # intersect(_version_groups => [ "v74", "v70", "v60" ]
        _active_versions: "{{ molecule_yml.platforms | map(attribute='groups') | flatten | intersect(_version_groups) }}"
      block:
        - name: Create Zabbix server database container(s)
          community.docker.docker_container:
            name: "zabbix-server-{{ _version }}-db"
            image: "timescale/timescaledb:{{ _pgsql_tag }}"
            state: started
            recreate: true
            networks:
              - name: zabbix
            env:
              POSTGRES_USER: "zabbix"
              POSTGRES_PASSWORD: "zabbix"
          loop: "{{ _active_versions }}"
          loop_control:
            label: "zabbix-server-{{ _version }}-db"
            loop_var: _version
          vars:
            _pgsql_tag: "{{ (_version in _pgsql_13_versions) | ternary('latest-pg13', 'latest-pg15') }}"

        - name: Create Zabbix server certificate(s)
          command: >-
            openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes
              -subj '/O=ansible_collections/OU=community.zabbix/CN={{ _cn }}' -days 365
              -extensions usr_cert
                -addext 'keyUsage = critical, digitalSignature'
                -addext 'basicConstraints = critical, CA:FALSE'
                -addext 'extendedKeyUsage = serverAuth, clientAuth'
                -addext 'subjectAltName = DNS:{{ _cn }}'
              -CAkey ca.key -CA ca.crt
              -keyout {{ _cn }}.key
              -out {{ _cn }}.crt
          args:
            chdir: "{{ _pki_dir }}"
            creates: "{{ _cn }}.crt"
          loop: "{{ _active_versions }}"
          loop_control:
            loop_var: _version
          vars:
            _cn: "zabbix-server-{{ _version }}"

        # The server container runs as uid 1997, so the key must be world-readable.
        - name: Make Zabbix server key(s) readable by the container
          file:
            path: "{{ _pki_dir }}/zabbix-server-{{ _version }}.key"
            mode: "0644"
          loop: "{{ _active_versions }}"
          loop_control:
            loop_var: _version

        - name: Create Zabbix server container(s)
          community.docker.docker_container:
            name: "zabbix-server-{{ _version }}"
            image: "zabbix/zabbix-server-pgsql:alpine-{{ _g_to_v[_version] }}-latest"
            state: started
            recreate: true
            networks:
              - name: zabbix
            volumes:
              - "{{ _pki_dir }}/zabbix-server-{{ _version }}.key:{{ _tls_dir }}/server.key:ro,z"
              - "{{ _pki_dir }}/zabbix-server-{{ _version }}.crt:{{ _tls_dir }}/server.crt:ro,z"
              - "{{ _pki_dir }}/ca.crt:{{ _tls_dir }}/ca.crt:ro,z"
            env:
              DB_SERVER_HOST: "zabbix-server-{{ _version }}-db"
              POSTGRES_USER: "zabbix"
              POSTGRES_PASSWORD: "zabbix"
              POSTGRES_DB: "zabbix"
              ENABLE_TIMESCALEDB: "true"
              ZBX_PROXYCONFIGFREQUENCY: "10"
              # Only used for hosts/proxies configured for certificate TLS
              ZBX_TLSKEYFILE: "{{ _tls_dir }}/server.key"
              ZBX_TLSCERTFILE: "{{ _tls_dir }}/server.crt"
              ZBX_TLSCAFILE: "{{ _tls_dir }}/ca.crt"
          loop: "{{ _active_versions }}"
          loop_control:
            label: "zabbix-server-{{ _version }}"
            loop_var: _version
          vars:
            # Absolute paths work on all image versions.
            # TODO: 8.0 images moved mounted secrets to /run/zabbix/secrets/tls
            # https://github.com/zabbix/zabbix-docker#compatibility-notes
            _tls_dir: /var/lib/zabbix/enc

        - name: Create Zabbix web container(s)
          community.docker.docker_container:
            name: "zabbix-web-{{ _version }}"
            image: "zabbix/zabbix-web-nginx-pgsql:alpine-{{ _g_to_v[_version] }}-latest"
            state: started
            recreate: true
            networks:
              - name: zabbix
            published_ports:
              - "{{ 8000 + (_version | regex_replace('v', '') | int) }}:8080"
            env:
              DB_SERVER_HOST: "zabbix-server-{{ _version }}-db"
              POSTGRES_USER: "zabbix"
              POSTGRES_PASSWORD: "zabbix"
              POSTGRES_DB: "zabbix"
              ZBX_SERVER_HOST: "zabbix-server-{{ _version }}"
              PHP_TZ: "America/Toronto"
          loop: "{{ _active_versions }}"
          loop_control:
            label: "zabbix-web-{{ _version }}"
            loop_var: _version

  tasks:
    - name: Create database container(s)
      community.docker.docker_container:
        name: "{{ item.name }}-db"
        image: "{{ _container[_db_type].image }}"
        state: started
        recreate: true
        networks:
          - name: zabbix
        env: "{{ _container[_db_type].env }}"
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}-db"
      when: (item.groups | intersect(_database_groups) | length) > 0
      vars:
        _database_groups: ['mysql', 'pgsql']
        _db_type: "{{ item.groups | intersect(_database_groups) | first }}"
        _pgsql_tag: "{{ (item.groups | intersect(_pgsql_13_versions) | length > 0) | ternary('13', '15') }}"
        _container:
          mysql:
            image: "mysql:8.4.8"
            env: { MYSQL_ROOT_PASSWORD: changeme }
          pgsql:
            image: "postgres:{{ _pgsql_tag }}"
            env: { POSTGRES_PASSWORD: changeme }

    - name: Create OS container(s)
      community.docker.docker_container:
        name: "{{ item.name }}"
        image: "{{ item.image }}"
        state: started
        recreate: true
        privileged: "{{ item.privileged | default(omit) }}"
        networks:
          - name: zabbix
        volumes: "{{ item.volumes | default(omit) }}"
        cgroupns_mode: "{{ item.cgroupns_mode | default(omit) }}"
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"

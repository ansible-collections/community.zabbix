---
- name: Prepare
  hosts: all

  tasks:
    # suse containers have a partial python3.11 install, py311-rpm needed for package_facts
    - name: Installing packages
      package:
        name: "{{ _packages | select | list }}"
        update_cache: "{{ (ansible_facts['os_family'] in ['Debian', 'Suse']) | ternary(true, omit) }}"
      vars:
        _py3_rpm: "python3{% if ansible_facts.python.version.minor != 6 %}{{ ansible_facts.python.version.minor }}{% endif %}-rpm"
        _packages:
          - sudo
          - "{{ (ansible_facts['os_family'] == 'Suse') | ternary(_py3_rpm, '') }}"
      register: _installation_dependencies
      until: _installation_dependencies is succeeded

    # Minimal Debian/Ubuntu images strip /usr/share/man, and the OpenJDK
    # postinst fails registering its man pages without man1.
    # https://bugs.debian.org/863199
    - name: Workaround Java issue for Debian
      file:
        path: /usr/share/man/man1
        state: directory
      when: ansible_facts['os_family'] == 'Debian'

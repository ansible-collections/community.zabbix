---
- name: Test dashboard and global regular expression configuration
  vars:
    configuration_rules:
      dashboards:
        createMissing: true
        updateExisting: true
      global_regexes:
        createMissing: true
        updateExisting: true
  block:
    - name: Predict dashboard and regular expression creation
      community.zabbix.zabbix_configuration:
        content_yaml: "{{ lookup('file', 'configuration8.yaml') }}"
        rules: "{{ configuration_rules }}"
        return_missing_objects: true
      check_mode: true
      register: configuration_check

    - name: Import dashboards and regular expressions
      community.zabbix.zabbix_configuration:
        content_yaml: "{{ lookup('file', 'configuration8.yaml') }}"
        rules: "{{ configuration_rules }}"
        return_missing_objects: true
      register: configuration_create

    - name: Repeat import with missing-object reporting
      community.zabbix.zabbix_configuration:
        content_yaml: "{{ lookup('file', 'configuration8.yaml') }}"
        rules: "{{ configuration_rules }}"
        return_missing_objects: true
      register: configuration_repeat

    - name: Repeat import with reporting explicitly disabled
      community.zabbix.zabbix_configuration:
        content_yaml: "{{ lookup('file', 'configuration8.yaml') }}"
        rules: "{{ configuration_rules }}"
        return_missing_objects: false
      register: configuration_reporting_disabled

    - name: Verify an unchanged import in check mode
      community.zabbix.zabbix_configuration:
        content_yaml: "{{ lookup('file', 'configuration8.yaml') }}"
        rules: "{{ configuration_rules }}"
        return_missing_objects: true
      check_mode: true
      register: configuration_unchanged_check

    - name: Assert check mode, creation and unchanged comparison metadata
      ansible.builtin.assert:
        that:
          - configuration_check is changed
          - configuration_check.missing_objects == {}
          - configuration_create is changed
          - configuration_create.missing_objects == {}
          - configuration_repeat is not changed
          - configuration_repeat.missing_objects == {}
          - configuration_reporting_disabled is not changed
          - configuration_reporting_disabled.missing_objects is not defined
          - configuration_unchanged_check is not changed
          - configuration_unchanged_check.missing_objects == {}

    - name: Predict dashboard and regular expression updates
      community.zabbix.zabbix_configuration:
        content_yaml: "{{ lookup('file', 'configuration8_updated.yaml') }}"
        rules: "{{ configuration_rules }}"
        return_missing_objects: true
      check_mode: true
      register: configuration_update_check

    - name: Update dashboards and regular expressions without requesting metadata
      community.zabbix.zabbix_configuration:
        content_yaml: "{{ lookup('file', 'configuration8_updated.yaml') }}"
        rules: "{{ configuration_rules }}"
      register: configuration_update

    - name: Repeat dashboard and regular expression updates
      community.zabbix.zabbix_configuration:
        content_yaml: "{{ lookup('file', 'configuration8_updated.yaml') }}"
        rules: "{{ configuration_rules }}"
      register: configuration_update_repeat

    - name: Assert update and idempotence
      ansible.builtin.assert:
        that:
          - configuration_update_check is changed
          - configuration_update is changed
          - configuration_update_repeat is not changed
          - configuration_update.missing_objects is not defined

    - name: Get imported object IDs
      ansible.builtin.uri:
        url: "{{ zabbix_api_server_url }}/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ check_login_result.json.result }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "{{ item.method }}"
          params:
            filter:
              name: "{{ item.name }}"
          id: 1
      vars:
        ansible_connection: local
      loop:
        - method: regexp.get
          name: Configuration export test regex
        - method: dashboard.get
          name: Configuration export test dashboard
      register: configuration_objects

    - name: Export the global regular expression as JSON
      community.zabbix.zabbix_configuration:
        export_options:
          global_regexes: "{{ configuration_objects.results[0].json.result | map(attribute='regexpid') | list }}"
      register: configuration_export_json

    - name: Assert the exported regular expression contains the update
      ansible.builtin.assert:
        that:
          - configuration_export_json is not changed
          - (configuration_export_json.exported_config | from_json).zabbix_export.global_regexes[0].name == 'Configuration export test regex'
          - (configuration_export_json.exported_config | from_json).zabbix_export.global_regexes[0].expressions[0].expression == '^updated$'

    - name: Export both objects as YAML in check mode
      community.zabbix.zabbix_configuration:
        export_options:
          global_regexes: "{{ configuration_objects.results[0].json.result | map(attribute='regexpid') | list }}"
          dashboards: "{{ configuration_objects.results[1].json.result | map(attribute='dashboardid') | list }}"
        export_format: yaml
      check_mode: true
      register: configuration_export_yaml

    - name: Assert YAML export is read-only and contains both objects
      ansible.builtin.assert:
        that:
          - configuration_export_yaml is not changed
          - (configuration_export_yaml.exported_config | from_yaml).zabbix_export.global_regexes | length == 1
          - (configuration_export_yaml.exported_config | from_yaml).zabbix_export.dashboards[0].pages[0].widgets[0].width | int == 7

    - name: Import exported dashboard and regular expression YAML without changes
      community.zabbix.zabbix_configuration:
        content_yaml: "{{ configuration_export_yaml.exported_config }}"
        rules: "{{ configuration_rules }}"
        return_missing_objects: true
      register: configuration_yaml_roundtrip

    - name: Assert YAML export can be imported without changes
      ansible.builtin.assert:
        that:
          - configuration_yaml_roundtrip is not changed
          - configuration_yaml_roundtrip.missing_objects == {}

    - name: Export the regular expression as XML
      community.zabbix.zabbix_configuration:
        export_options:
          global_regexes: "{{ configuration_objects.results[0].json.result | map(attribute='regexpid') | list }}"
        export_format: xml
      register: configuration_export_xml

    - name: Assert XML export is read-only and contains the regular expression
      ansible.builtin.assert:
        that:
          - configuration_export_xml is not changed
          - "'<global_regexes>' in configuration_export_xml.exported_config"
          - "'^updated$' in configuration_export_xml.exported_config"

    - name: Import exported JSON without changes
      community.zabbix.zabbix_configuration:
        content_json: "{{ configuration_export_json.exported_config }}"
        rules:
          global_regexes:
            createMissing: true
            updateExisting: true
        return_missing_objects: true
      register: configuration_roundtrip

    - name: Assert JSON export can be imported without changes
      ansible.builtin.assert:
        that:
          - configuration_roundtrip is not changed
          - configuration_roundtrip.missing_objects == {}

    - name: Import with omitted rules without changing configuration
      community.zabbix.zabbix_configuration:
        content_yaml: "{{ lookup('file', 'configuration8_updated.yaml') }}"
      register: configuration_omitted_rules

    - name: Assert omitted rules are handled
      ansible.builtin.assert:
        that: configuration_omitted_rules is not changed

    - name: Predict an import with missing referenced objects
      community.zabbix.zabbix_configuration:
        content_yaml: "{{ lookup('file', 'configuration8_missing.yaml') }}"
        rules:
          dashboards:
            createMissing: true
            updateExisting: true
        return_missing_objects: true
      check_mode: true
      register: configuration_missing_check

    - name: Import a dashboard with missing references through the direct import path
      community.zabbix.zabbix_configuration:
        content_yaml: "{{ lookup('file', 'configuration8_missing.yaml') }}"
        rules:
          dashboards:
            createMissing: true
            updateExisting: true
          images:
            createMissing: false
        return_missing_objects: true
      register: configuration_missing_import

    - name: Assert comparison and import return missing referenced hosts
      ansible.builtin.assert:
        that:
          - configuration_missing_check is changed
          - configuration_missing_check.missing_objects.hosts[0].name == 'Configuration missing referenced host'
          - configuration_missing_import is changed
          - configuration_missing_import.missing_objects.hosts[0].name == 'Configuration missing referenced host'

  always:
    - name: Find test dashboards for cleanup
      ansible.builtin.uri:
        url: "{{ zabbix_api_server_url }}/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ check_login_result.json.result }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: dashboard.get
          params:
            filter:
              name:
                - Configuration export test dashboard
                - Configuration missing reference dashboard
          id: 1
      vars:
        ansible_connection: local
      register: configuration_cleanup_dashboards

    - name: Delete test dashboards
      ansible.builtin.uri:
        url: "{{ zabbix_api_server_url }}/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ check_login_result.json.result }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: dashboard.delete
          params: "{{ configuration_cleanup_dashboards.json.result | map(attribute='dashboardid') | list }}"
          id: 1
      vars:
        ansible_connection: local
      when: configuration_cleanup_dashboards.json.result | default([]) | length > 0

    - name: Delete the test regular expression
      community.zabbix.zabbix_regexp:
        name: Configuration export test regex
        state: absent

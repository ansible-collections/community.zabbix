---
- name: Test Zabbix 8 authentication methods
  ansible.builtin.include_tasks: authentication8.yml
  when: zabbix_version is version('8.0', '>=')

- name: Test legacy authentication settings
  when: zabbix_version is version('8.0', '<')
  block:
    - include_tasks: zabbix_authentication_tests.yml
    - include_tasks: zabbix_authentication_test_passwd_check_rules.yml

  always:
    - name: Cleanup
      community.zabbix.zabbix_user_directory:
        name: TestUserDirectory
        state: absent
      when: zabbix_version is version('7.0', '>=')
      ignore_errors: true

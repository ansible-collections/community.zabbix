    - community-zabbix-auth8-disabled
  - name: Remove zabbix_user_directory fixtures
    community.zabbix.zabbix_user_directory:
      name: '{{ item }}'
      state: absent
    loop:
    - community-zabbix-auth8-ldap
    - community-zabbix-auth8-ldap-other
    - community-zabbix-auth8-saml
  - name: Remove zabbix_mfa fixtures
    community.zabbix.zabbix_mfa:
      name: '{{ item }}'
      state: absent
    loop:
    - community-zabbix-auth8-totp
    - community-zabbix-auth8-duo

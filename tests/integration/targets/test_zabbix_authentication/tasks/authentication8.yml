---
- name: Use a stable API credential while changing authentication
  ansible.builtin.set_fact:
    ansible_zabbix_auth_key: '{{ ansible_zabbix_auth_key | default(check_login_result.json.result) }}'
  no_log: true
- name: Read authentication.get directly from the API
  ansible.builtin.uri:
    url: '{{ zabbix_api_server_url }}/api_jsonrpc.php'
    method: POST
    body_format: json
    headers:
      Authorization: Bearer {{ ansible_zabbix_auth_key }}
    body:
      jsonrpc: '2.0'
      id: 1
      method: authentication.get
      params: {}
  delegate_to: localhost
  vars:
    ansible_connection: local
  register: auth8_original
  failed_when: '''error'' in auth8_original.json'
  no_log: true
- name: Read userdirectory.get directly from the API
  ansible.builtin.uri:
    url: '{{ zabbix_api_server_url }}/api_jsonrpc.php'
    method: POST
    body_format: json
    headers:
      Authorization: Bearer {{ ansible_zabbix_auth_key }}
    body:
      jsonrpc: '2.0'
      id: 1
      method: userdirectory.get
      params:
        output:
        - name
  delegate_to: localhost
  vars:
    ansible_connection: local
  register: auth8_preflight
  failed_when: '''error'' in auth8_preflight.json'
  no_log: true
- name: Verify userdirectory fixture names are unused
  ansible.builtin.assert:
    that:
    - auth8_preflight.json.result | map(attribute='name') | intersect(['community-zabbix-auth8-ldap', 'community-zabbix-auth8-ldap-other', 'community-zabbix-auth8-saml'])
      | length == 0
- name: Read mfa.get directly from the API
  ansible.builtin.uri:
    url: '{{ zabbix_api_server_url }}/api_jsonrpc.php'
    method: POST
    body_format: json
    headers:
      Authorization: Bearer {{ ansible_zabbix_auth_key }}
    body:
      jsonrpc: '2.0'
      id: 1
      method: mfa.get
      params:
        output:
        - name
  delegate_to: localhost
  vars:
    ansible_connection: local
  register: auth8_preflight
  failed_when: '''error'' in auth8_preflight.json'
  no_log: true
- name: Verify mfa fixture names are unused
  ansible.builtin.assert:
    that:
    - auth8_preflight.json.result | map(attribute='name') | intersect(['community-zabbix-auth8-totp', 'community-zabbix-auth8-duo']) | length == 0
- name: Read usergroup.get directly from the API
  ansible.builtin.uri:
    url: '{{ zabbix_api_server_url }}/api_jsonrpc.php'
    method: POST
    body_format: json
    headers:
      Authorization: Bearer {{ ansible_zabbix_auth_key }}
    body:
      jsonrpc: '2.0'
      id: 1
      method: usergroup.get
      params:
        output:
        - name
  delegate_to: localhost
  vars:
    ansible_connection: local
  register: auth8_preflight
  failed_when: '''error'' in auth8_preflight.json'
  no_log: true
- name: Verify usergroup fixture names are unused
  ansible.builtin.assert:
    that:
    - auth8_preflight.json.result | map(attribute='name') | intersect(['community-zabbix-auth8-disabled', 'community-zabbix-auth8-users']) | length == 0
- name: Read userdirectory.get directly from the API
  ansible.builtin.uri:
    url: '{{ zabbix_api_server_url }}/api_jsonrpc.php'
    method: POST
    body_format: json
    headers:
      Authorization: Bearer {{ ansible_zabbix_auth_key }}
    body:
      jsonrpc: '2.0'
      id: 1
      method: userdirectory.get
      params:
        output:
        - userdirectoryid
        filter:
          idp_type: 2
  delegate_to: localhost
  vars:
    ansible_connection: local
  register: auth8_preflight
  failed_when: '''error'' in auth8_preflight.json'
  no_log: true
- name: Require an unused SAML provider slot
  ansible.builtin.assert:
    that:
    - auth8_preflight.json.result | length == 0
- name: Exercise all Zabbix 8 authentication methods
  block:
  - name: Create a private temporary certificate directory
    ansible.builtin.tempfile:
      state: directory
      prefix: zabbix-auth8-
    delegate_to: localhost
    vars:
      ansible_connection: local
    register: auth8_certdir
  - name: Generate a temporary certificate and private key for API tests
    ansible.builtin.command:
      argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:2048
      - -nodes
      - -days
      - '1'
      - -subj
      - /CN=auth8.example.test
      - -keyout
      - '{{ auth8_certdir.path }}/key.pem'
      - -out
      - '{{ auth8_certdir.path }}/cert.pem'
    delegate_to: localhost
    vars:
      ansible_connection: local
    changed_when: true
    no_log: true
  - name: Configure Internal authentication and password policy
    community.zabbix.zabbix_authentication: &id001
      authentication_type: internal
      passwd_min_length: 12
      passwd_check_rules:
      - contain_uppercase_and_lowercase_letters
      - contain_digits
      - contain_digits
      - contain_special_characters
      - avoid_easy_to_guess
    register: auth8_changed
  - name: Verify configure internal authentication and password policy
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Configure Internal authentication and password policy again
    community.zabbix.zabbix_authentication: *id001
    register: auth8_repeated
  - name: Verify idempotency of configure internal authentication and password policy
    ansible.builtin.assert:
      that:
      - auth8_repeated is not changed
  - name: Read authentication.get directly from the API
    ansible.builtin.uri:
      url: '{{ zabbix_api_server_url }}/api_jsonrpc.php'
      method: POST
      body_format: json
      headers:
        Authorization: Bearer {{ ansible_zabbix_auth_key }}
      body:
        jsonrpc: '2.0'
        id: 1
        method: authentication.get
        params: {}
    delegate_to: localhost
    vars:
      ansible_connection: local
    register: auth8_api
    failed_when: '''error'' in auth8_api.json'
    no_log: true
  - name: Verify Internal authentication and password bitmap
    ansible.builtin.assert:
      that:
      - auth8_api.json.result.authentication_type | int == 0
      - auth8_api.json.result.passwd_check_rules | int == 15
      - auth8_api.json.result.passwd_min_length | int == 12
  - name: Reject password length zero
    community.zabbix.zabbix_authentication:
      passwd_min_length: 0
    register: auth8_rejected
    failed_when: '''1-70'' not in (auth8_rejected.msg | default(''''))'
  - name: Preview enabling HTTP authentication
    community.zabbix.zabbix_authentication:
      http_auth_enabled: true
    register: auth8_changed
    check_mode: true
  - name: Verify preview enabling http authentication
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Read authentication.get directly from the API
    ansible.builtin.uri:
      url: '{{ zabbix_api_server_url }}/api_jsonrpc.php'
      method: POST
      body_format: json
      headers:
        Authorization: Bearer {{ ansible_zabbix_auth_key }}
      body:
        jsonrpc: '2.0'
        id: 1
        method: authentication.get
        params: {}
    delegate_to: localhost
    vars:
      ansible_connection: local
    register: auth8_api
    failed_when: '''error'' in auth8_api.json'
    no_log: true
  - name: Verify HTTP check mode made no API change
    ansible.builtin.assert:
      that:
      - auth8_api.json.result.http_auth_enabled | int == 0
  - name: Configure HTTP authentication
    community.zabbix.zabbix_authentication: &id002
      http_auth_enabled: true
      http_login_form: http_login_form
      http_strip_domains:
      - example
      - corp
      http_case_sensitive: false
    register: auth8_changed
  - name: Verify configure http authentication
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Configure HTTP authentication again
    community.zabbix.zabbix_authentication: *id002
    register: auth8_repeated
  - name: Verify idempotency of configure http authentication
    ansible.builtin.assert:
      that:
      - auth8_repeated is not changed
  - name: Read authentication.get directly from the API
    ansible.builtin.uri:
      url: '{{ zabbix_api_server_url }}/api_jsonrpc.php'
      method: POST
      body_format: json
      headers:
        Authorization: Bearer {{ ansible_zabbix_auth_key }}
      body:
        jsonrpc: '2.0'
        id: 1
        method: authentication.get
        params: {}
    delegate_to: localhost
    vars:
      ansible_connection: local
    register: auth8_api
    failed_when: '''error'' in auth8_api.json'
    no_log: true
  - name: Verify persisted HTTP settings
    ansible.builtin.assert:
      that:
      - auth8_api.json.result.http_auth_enabled | int == 1
      - auth8_api.json.result.http_login_form | int == 1
      - auth8_api.json.result.http_strip_domains == 'example,corp'
      - auth8_api.json.result.http_case_sensitive | int == 0
  - name: Clear HTTP domains and restore the Zabbix login form
    community.zabbix.zabbix_authentication: &id003
      http_auth_enabled: false
      http_login_form: zabbix_login_form
      http_strip_domains: []
      http_case_sensitive: true
    register: auth8_changed
  - name: Verify clear http domains and restore the zabbix login form
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Clear HTTP domains and restore the Zabbix login form again
    community.zabbix.zabbix_authentication: *id003
    register: auth8_repeated
  - name: Verify idempotency of clear http domains and restore the zabbix login form
    ansible.builtin.assert:
      that:
      - auth8_repeated is not changed
  - name: Read authentication.get directly from the API
    ansible.builtin.uri:
      url: '{{ zabbix_api_server_url }}/api_jsonrpc.php'
      method: POST
      body_format: json
      headers:
        Authorization: Bearer {{ ansible_zabbix_auth_key }}
      body:
        jsonrpc: '2.0'
        id: 1
        method: authentication.get
        params: {}
    delegate_to: localhost
    vars:
      ansible_connection: local
    register: auth8_api
    failed_when: '''error'' in auth8_api.json'
    no_log: true
  - name: Verify empty HTTP domains were persisted
    ansible.builtin.assert:
      that:
      - auth8_api.json.result.http_strip_domains == ''
      - auth8_api.json.result.http_auth_enabled | int == 0
  - name: Create the similarly named LDAP provider
    community.zabbix.zabbix_user_directory: &id004
      name: community-zabbix-auth8-ldap-other
      idp_type: ldap
      host: ldap://ldap.example.test
      port: 389
      base_dn: dc=example,dc=test
      search_attribute: uid
    register: auth8_changed
  - name: Verify create the similarly named ldap provider
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Create the similarly named LDAP provider again
    community.zabbix.zabbix_user_directory: *id004
    register: auth8_repeated
  - name: Verify idempotency of create the similarly named ldap provider
    ansible.builtin.assert:
      that:
      - auth8_repeated is not changed
  - name: Preview creating the LDAP provider
    community.zabbix.zabbix_user_directory:
      name: community-zabbix-auth8-ldap
      idp_type: ldap
      host: ldap://ldap.example.test
      port: 389
      base_dn: dc=example,dc=test
      search_attribute: uid
    register: auth8_changed
    check_mode: true
  - name: Verify preview creating the ldap provider
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Create the LDAP provider
    community.zabbix.zabbix_user_directory: &id005
      name: community-zabbix-auth8-ldap
      idp_type: ldap
      host: ldap://ldap.example.test
      port: 389
      base_dn: dc=example,dc=test
      search_attribute: uid
    register: auth8_changed
  - name: Verify create the ldap provider
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Create the LDAP provider again
    community.zabbix.zabbix_user_directory: *id005
    register: auth8_repeated
  - name: Verify idempotency of create the ldap provider
    ansible.builtin.assert:
      that:
      - auth8_repeated is not changed
  - name: Update only the LDAP description and StartTLS option
    community.zabbix.zabbix_user_directory: &id006
      name: community-zabbix-auth8-ldap
      description: Updated LDAP provider
      start_tls: 1
    register: auth8_changed
  - name: Verify update only the ldap description and starttls option
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Update only the LDAP description and StartTLS option again
    community.zabbix.zabbix_user_directory: *id006
    register: auth8_repeated
  - name: Verify idempotency of update only the ldap description and starttls option
    ansible.builtin.assert:
      that:
      - auth8_repeated is not changed
  - name: Clear the LDAP description and disable StartTLS
    community.zabbix.zabbix_user_directory: &id007
      name: community-zabbix-auth8-ldap
      description: ''
      start_tls: 0
    register: auth8_changed
  - name: Verify clear the ldap description and disable starttls
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Clear the LDAP description and disable StartTLS again
    community.zabbix.zabbix_user_directory: *id007
    register: auth8_repeated
  - name: Verify idempotency of clear the ldap description and disable starttls
    ansible.builtin.assert:
      that:
      - auth8_repeated is not changed
  - name: Set LDAP bind credentials
    community.zabbix.zabbix_user_directory:
      name: community-zabbix-auth8-ldap
      bind_dn: cn=search,dc=example,dc=test
      bind_password: fixture-only-secret
    register: auth8_changed
  - name: Verify set ldap bind credentials
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Clear LDAP bind credentials
    community.zabbix.zabbix_user_directory:
      name: community-zabbix-auth8-ldap
      bind_dn: ''
      bind_password: ''
    register: auth8_changed
  - name: Verify clear ldap bind credentials
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Preserve LDAP settings when options are omitted
    community.zabbix.zabbix_user_directory:
      name: community-zabbix-auth8-ldap
    register: auth8_changed
  - name: Verify preserve ldap settings when options are omitted
    ansible.builtin.assert:
      that:
      - auth8_changed is not changed
  - name: Reject StartTLS with an LDAPS URI
    community.zabbix.zabbix_user_directory:
      name: community-zabbix-auth8-ldap
      host: ldaps://ldap.example.test
      start_tls: 1
    register: auth8_rejected
    failed_when: '''start_tls cannot'' not in (auth8_rejected.msg | default(''''))'
  - name: Select the exact LDAP provider and enable LDAP authentication
    community.zabbix.zabbix_authentication: &id008
      ldap_auth_enabled: true
      ldap_userdirectory: community-zabbix-auth8-ldap
      ldap_case_sensitive: false
    register: auth8_changed
  - name: Verify select the exact ldap provider and enable ldap authentication
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Select the exact LDAP provider and enable LDAP authentication again
    community.zabbix.zabbix_authentication: *id008
    register: auth8_repeated
  - name: Verify idempotency of select the exact ldap provider and enable ldap authentication
    ansible.builtin.assert:
      that:
      - auth8_repeated is not changed
  - name: Read authentication.get directly from the API
    ansible.builtin.uri:
      url: '{{ zabbix_api_server_url }}/api_jsonrpc.php'
      method: POST
      body_format: json
      headers:
        Authorization: Bearer {{ ansible_zabbix_auth_key }}
      body:
        jsonrpc: '2.0'
        id: 1
        method: authentication.get
        params: {}
    delegate_to: localhost
    vars:
      ansible_connection: local
    register: auth8_api
    failed_when: '''error'' in auth8_api.json'
    no_log: true
  - name: Save the exact selected LDAP provider ID
    ansible.builtin.set_fact:
      auth8_ldap_id: '{{ auth8_api.json.result.ldap_userdirectoryid }}'
  - name: Read userdirectory.get directly from the API
    ansible.builtin.uri:
      url: '{{ zabbix_api_server_url }}/api_jsonrpc.php'
      method: POST
      body_format: json
      headers:
        Authorization: Bearer {{ ansible_zabbix_auth_key }}
      body:
        jsonrpc: '2.0'
        id: 1
        method: userdirectory.get
        params:
          output:
          - name
          userdirectoryids:
          - '{{ auth8_ldap_id }}'
    delegate_to: localhost
    vars:
      ansible_connection: local
    register: auth8_api
    failed_when: '''error'' in auth8_api.json'
    no_log: true
  - name: Verify exact LDAP provider selection
    ansible.builtin.assert:
      that:
      - auth8_api.json.result[0].name == 'community-zabbix-auth8-ldap'
  - name: Use LDAP as the default authentication method
    community.zabbix.zabbix_authentication: &id009
      authentication_type: ldap
    register: auth8_changed
  - name: Verify use ldap as the default authentication method
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Use LDAP as the default authentication method again
    community.zabbix.zabbix_authentication: *id009
    register: auth8_repeated
  - name: Verify idempotency of use ldap as the default authentication method
    ansible.builtin.assert:
      that:
      - auth8_repeated is not changed
  - name: Reject disabling LDAP while it is the default
    community.zabbix.zabbix_authentication:
      ldap_auth_enabled: false
    register: auth8_rejected
    failed_when: '''requires ldap_auth_enabled'' not in (auth8_rejected.msg | default(''''))'
  - name: Reject a partial LDAP provider name
    community.zabbix.zabbix_authentication:
      ldap_userdirectory: community-zabbix-auth8-lda
    register: auth8_rejected
    failed_when: '''LDAP user directory not found'' not in (auth8_rejected.msg | default(''''))'
  - name: Return to Internal authentication
    community.zabbix.zabbix_authentication: &id010
      authentication_type: internal
    register: auth8_changed
  - name: Verify return to internal authentication
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Return to Internal authentication again
    community.zabbix.zabbix_authentication: *id010
    register: auth8_repeated
  - name: Verify idempotency of return to internal authentication
    ansible.builtin.assert:
      that:
      - auth8_repeated is not changed
  - name: Create a disabled group for deprovisioned users
    community.zabbix.zabbix_usergroup: &id011
      name: community-zabbix-auth8-disabled
      status: disabled
    register: auth8_changed
  - name: Verify create a disabled group for deprovisioned users
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Create a disabled group for deprovisioned users again
    community.zabbix.zabbix_usergroup: *id011
    register: auth8_repeated
  - name: Verify idempotency of create a disabled group for deprovisioned users
    ansible.builtin.assert:
      that:
      - auth8_repeated is not changed
  - name: Configure LDAP provisioning and media mappings
    community.zabbix.zabbix_user_directory: &id012
      name: community-zabbix-auth8-ldap
      provision_status: true
      group_name: cn
      group_basedn: ou=Groups,dc=example,dc=test
      group_member: member
      provision_groups: &id021
      - name: staff*
        role: Guest role
        user_groups:
        - Guests
      provision_media: &id022
      - name: Email mapping
        mediatype: Email
        attribute: mail
        active: false
        severity: 0
        period: 1-5,09:00-17:00
    register: auth8_changed
  - name: Verify configure ldap provisioning and media mappings
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Configure LDAP provisioning and media mappings again
    community.zabbix.zabbix_user_directory: *id012
    register: auth8_repeated
  - name: Verify idempotency of configure ldap provisioning and media mappings
    ansible.builtin.assert:
      that:
      - auth8_repeated is not changed
  - name: Enable global LDAP provisioning
    community.zabbix.zabbix_authentication: &id013
      ldap_jit_status: true
      disabled_usrgroup: community-zabbix-auth8-disabled
      jit_provision_interval: 2h
    register: auth8_changed
  - name: Verify enable global ldap provisioning
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Enable global LDAP provisioning again
    community.zabbix.zabbix_authentication: *id013
    register: auth8_repeated
  - name: Verify idempotency of enable global ldap provisioning
    ansible.builtin.assert:
      that:
      - auth8_repeated is not changed
  - name: Update the provisioning interval without repeating the disabled group
    community.zabbix.zabbix_authentication: &id014
      jit_provision_interval: 3h
    register: auth8_changed
  - name: Verify update the provisioning interval without repeating the disabled group
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Update the provisioning interval without repeating the disabled group again
    community.zabbix.zabbix_authentication: *id014
    register: auth8_repeated
  - name: Verify idempotency of update the provisioning interval without repeating the disabled group
    ansible.builtin.assert:
      that:
      - auth8_repeated is not changed
  - name: Preserve all omitted global authentication settings
    community.zabbix.zabbix_authentication: {}
    register: auth8_changed
  - name: Verify preserve all omitted global authentication settings
    ansible.builtin.assert:
      that:
      - auth8_changed is not changed
  - name: Read authentication.get directly from the API
    ansible.builtin.uri:
      url: '{{ zabbix_api_server_url }}/api_jsonrpc.php'
      method: POST
      body_format: json
      headers:
        Authorization: Bearer {{ ansible_zabbix_auth_key }}
      body:
        jsonrpc: '2.0'
        id: 1
        method: authentication.get
        params: {}
    delegate_to: localhost
    vars:
      ansible_connection: local
    register: auth8_api
    failed_when: '''error'' in auth8_api.json'
    no_log: true
  - name: Verify the omitted interval and group were preserved
    ansible.builtin.assert:
      that:
      - auth8_api.json.result.jit_provision_interval == '3h'
      - auth8_api.json.result.disabled_usrgrpid | int > 0
  - name: Read userdirectory.get directly from the API
    ansible.builtin.uri:
      url: '{{ zabbix_api_server_url }}/api_jsonrpc.php'
      method: POST
      body_format: json
      headers:
        Authorization: Bearer {{ ansible_zabbix_auth_key }}
      body:
        jsonrpc: '2.0'
        id: 1
        method: userdirectory.get
        params:
          userdirectoryids:
          - '{{ auth8_ldap_id }}'
          selectProvisionMedia: extend
    delegate_to: localhost
    vars:
      ansible_connection: local
    register: auth8_api
    failed_when: '''error'' in auth8_api.json'
    no_log: true
  - name: Verify false and zero provisioning media settings
    ansible.builtin.assert:
      that:
      - auth8_api.json.result[0].provision_media[0].active | int == 1
      - auth8_api.json.result[0].provision_media[0].severity | int == 0
  - name: Disable LDAP provisioning and clear its global group reference
    community.zabbix.zabbix_authentication: &id015
      ldap_jit_status: false
      disabled_usrgroup: ''
    register: auth8_changed
  - name: Verify disable ldap provisioning and clear its global group reference
    ansible.builtin.assert:
      that:
      - auth8_changed is changed
  - name: Disable LDAP provisioning and clear its global group reference again
    community.zabbix.zabbix_authentication: *id015
    register: auth8_repeated
  - name: Verify idempotency of disable ldap provisioning and clear its global group reference
    ansible.builtin.assert:
      that:
      - auth8_repeated is not changed
  - name: Disable directory provisioning and clear its mappings

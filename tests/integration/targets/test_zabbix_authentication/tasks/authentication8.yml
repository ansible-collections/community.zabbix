        id: 99
        method: authentication.update
        params: '{{ auth8_original.json.result }}'
    delegate_to: localhost
    vars:
      ansible_connection: local
    register: auth8_restore
    failed_when: '''error'' in auth8_restore.json'
    no_log: true

---
- name: Test telemetry query LLD rule prototypes
  module_defaults:
    community.zabbix.zabbix_discoveryruleprototype:
      name: !unsafe 'Telemetry discovery for {#SERVICE}'
      discoveryrule_name: Prototype parent
      host_name: "{{ prototype_target.host_name | default(omit) }}"
      template_name: "{{ prototype_target.template_name | default(omit) }}"
  vars:
    telemetry_query:
      signal_type: 0
      columns:
        - column: ResourceAttributes
          attribute_key: service.name
      aggregated_columns:
        - function: 4
          alias: record_count
      filter:
        evaltype: 0
        conditions:
          - column: ServiceName
            operator: 0
            value: example
          - column: ResourceAttributes
            attribute_key: service.name
            operator: 0
            value: !unsafe '{#SERVICE}'
    telemetry_params:
      type: telemetry_query
      key: !unsafe 'telemetry.discovery[{#SERVICE}]'
      interval: 1m
      enabled: false
      query: "{{ telemetry_query }}"
      time_shift: 15s
      lookback_limit: 10m
      granularity: 15s
      timeout: 5s
  block:
    - name: Predict telemetry prototype creation
      community.zabbix.zabbix_discoveryruleprototype:
        params: "{{ telemetry_params }}"
      check_mode: true
      register: telemetry_create_check

    - name: Create the telemetry prototype
      community.zabbix.zabbix_discoveryruleprototype:
        params: "{{ telemetry_params }}"
      register: telemetry_create

    - name: Repeat telemetry prototype creation
      community.zabbix.zabbix_discoveryruleprototype:
        params: "{{ telemetry_params }}"
      register: telemetry_repeat

    - name: Assert telemetry prototype creation and idempotence
      ansible.builtin.assert:
        that:
          - telemetry_create_check is changed
          - telemetry_create is changed
          - telemetry_repeat is not changed

    - name: Update telemetry prototype query and time settings
      community.zabbix.zabbix_discoveryruleprototype:
        params:
          query: "{{ telemetry_query | combine({'signal_type': 2}) }}"
          time_shift: 30s
          lookback_limit: 20m
          granularity: 1m
          timeout: ""
      register: telemetry_update

    - name: Repeat telemetry prototype update
      community.zabbix.zabbix_discoveryruleprototype:
        params:
          query: "{{ telemetry_query | combine({'signal_type': 2}) }}"
          time_shift: 30s
          lookback_limit: 20m
          granularity: 1m
          timeout: ""
      register: telemetry_update_repeat

    - name: Assert telemetry prototype update and idempotence
      ansible.builtin.assert:
        that:
          - telemetry_update is changed
          - telemetry_update_repeat is not changed

    - name: Read the persisted telemetry prototype from the API
      ansible.builtin.uri:
        url: "{{ zabbix_api_server_url }}/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ check_login_result.json.result }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: discoveryruleprototype.get
          params:
            itemids: "{{ telemetry_create.result.itemids }}"
            output: [type, query, time_shift, lookback_limit, granularity, timeout]
          id: 1
      vars:
        ansible_connection: local
      register: telemetry_api_result

    - name: Assert the stored prototype type, query and time settings
      ansible.builtin.assert:
        that:
          - telemetry_api_result.json.result | length == 1
          - telemetry_api_result.json.result[0].type | int == 24
          - telemetry_api_result.json.result[0].query.signal_type | int == 2
          - >-
            telemetry_api_result.json.result[0].query.filter.conditions
            | selectattr('column', 'equalto', 'ResourceAttributes') | map(attribute='value') | first
            == telemetry_query.filter.conditions[1].value
          - telemetry_api_result.json.result[0].time_shift == '30s'
          - telemetry_api_result.json.result[0].lookback_limit == '20m'
          - telemetry_api_result.json.result[0].granularity == '1m'
          - telemetry_api_result.json.result[0].timeout == ''

    - name: Delete the telemetry prototype
      community.zabbix.zabbix_discoveryruleprototype:
        state: absent
      register: telemetry_delete

    - name: Repeat telemetry prototype deletion
      community.zabbix.zabbix_discoveryruleprototype:
        state: absent
      register: telemetry_delete_repeat

    - name: Assert telemetry prototype deletion and idempotence
      ansible.builtin.assert:
        that:
          - telemetry_delete is changed
          - telemetry_delete_repeat is not changed

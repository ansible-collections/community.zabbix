---
- name: test - do not run tests for Zabbix < 7.0
  meta: end_play
  when: zabbix_version is version('7.0', '<')

- block:
    # setup stuff
    - include_tasks: zabbix_setup.yml

    - name: Test httptest lifecycle on hosts and templates
      ansible.builtin.include_tasks: zabbix_tests.yml
      loop:
        - type: host_name
          name: ExampleHost
        - type: template_name
          name: ExampleTemplate
      loop_control:
        loop_var: httptest_target

    - name: Test httptest target validation
      ansible.builtin.include_tasks: zabbix_validation.yml

  always:
    - name: Cleanup template httptests if tests failed
      community.zabbix.zabbix_httptest:
        template_name: ExampleTemplate
        name: "{{ item }}"
        state: absent
      ignore_errors: true
      loop:
        - ExampleTest
        - NewExampleTest

    - name: Cleanup host httptests if tests failed
      community.zabbix.zabbix_httptest:
        host_name: ExampleHost
        name: "{{ item }}"
        state: absent
      ignore_errors: true
      loop:
        - ExampleTest
        - NewExampleTest

    - name: Remove test hosts and templates
      ansible.builtin.include_tasks: zabbix_teardown.yml
